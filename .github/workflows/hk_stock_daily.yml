name: Daily HK Stock Analysis Radar

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      # 这里升级到了 v4
      uses: actions/checkout@v4

    - name: Set up Python
      # 这里升级到了 v5
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy tqcenter

    - name: Run daily HK stock quantitative scan
      run: python daily_HK_stock_analysis.py

    - name: Commit and push generated report (Keepalive)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add daily_report_*.md
        git commit -m "Auto-generate daily HK stock report and keep workflow alive" || echo "No changes to commit"
        git push
